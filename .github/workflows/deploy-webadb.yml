name: Deploy YiDream Web ADB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'webadb/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/deploy-webadb.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Récupérer l’APK YiDream officiel et vérifier son empreinte
        run: |
          mkdir -p webadb/public
          curl --fail --silent --show-error --retry 3 https://yidreamkosher.github.io/YiDream/version.json -o "$RUNNER_TEMP/yidream-version.json"
          ADVERTISED_APK_URL=$(jq -er '.apkUrl | select(. == "https://yidreamkosher.github.io/YiDream/admin/yidream.apk" or . == "https://qinfrance.github.io/YiDream/admin/yidream.apk")' "$RUNNER_TEMP/yidream-version.json")
          APK_URL="https://yidreamkosher.github.io/YiDream/admin/yidream.apk"
          APK_SHA=$(jq -er '.apkSha256 | select(test("^[a-fA-F0-9]{64}$"))' "$RUNNER_TEMP/yidream-version.json")
          curl --fail --silent --show-error --retry 3 "$APK_URL" -o webadb/public/yidream.apk
          echo "$APK_SHA  webadb/public/yidream.apk" | sha256sum --check
          jq --arg apk "$APK_URL" '.apkUrl = $apk' "$RUNNER_TEMP/yidream-version.json" > webadb/public/yidream-version.json
          curl --fail --silent --show-error --retry 3 https://yidreamkosher.github.io/YiDream/admin/yidream-build.json -o webadb/public/yidream-build.json
          cat webadb/supabase/migrations/20261029000000_mdm_catalog_and_site_requests.sql webadb/supabase/migrations/20261030000000_catalog_releases_and_revocation.sql webadb/supabase/migrations/20261104000000_owner_only_app_import.sql > webadb/public/mdm-setup.sql

      # --- Compilation et déploiement du site ---
      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Vérifier les réexécutions de la migration SQL
        working-directory: webadb/supabase/tests
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Installer les dépendances
        working-directory: webadb
        run: npm ci

      - name: Compiler le site
        working-directory: webadb
        run: |
          python3 -m unittest discover -s tests -p 'owner_import_test.py'
          node --test tests/*.test.mjs
          npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: webadb/dist

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
